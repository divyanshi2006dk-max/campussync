<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CampusSync — Remote Student Phone Dashboard</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#121826; --border:#232c3d; --text:#f1f5f9; --muted:#8b96a8;
    --accent:#4f9dde; --green:#2fae66; --amber:#d08a2c; --red:#d14f4f; --slate:#3a4457;
  }
  *{box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
  body{background:var(--bg);color:var(--text);margin:0;padding:28px}
  .wrap{max-width:1040px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:22px}
  h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.2px}
  .tag{color:var(--muted);font-size:13px;margin-top:4px}
  .status{background:#132a1f;color:#4ade80;padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
  .card h2{margin:0 0 12px;font-size:12px;letter-spacing:.4px;color:var(--muted);text-transform:uppercase}
  .row{display:flex;gap:8px}
  input,textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:7px;font-size:14px}
  button{border:none;color:white;padding:10px 14px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer}
  button:hover{filter:brightness(1.12)}
  button:active{filter:brightness(0.92)}
  .grid2{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .full{width:100%}
  .c-green{background:var(--green)} .c-blue{background:var(--accent)}
  .c-amber{background:var(--amber)} .c-red{background:var(--red)} .c-slate{background:var(--slate)}
  .feed{background:#000;border:1px solid var(--border);border-radius:9px;height:300px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:10px}
  .feed img{max-width:100%;max-height:100%;object-fit:contain}
  .placeholder{color:#55617a;font-size:13px;text-align:center;padding:20px}
  .gps{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--border);padding:9px 12px;border-radius:7px;font-size:13px;margin-top:10px}
  a{color:var(--accent);text-decoration:none;font-weight:600}
  .log{font-size:12px;color:var(--muted);margin-top:10px;min-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>CampusSync Dashboard</h1>
      <div class="tag">Pair a phone, then control it from here</div>
    </div>
    <div class="status" id="sessionBadge">Not paired</div>
  </header>

  <div class="card">
    <h2>1 · Pair a phone</h2>
    <div class="row">
      <input id="phoneInput" placeholder="WhatsApp number with country code, e.g. 9198XXXXXXXX">
      <button class="c-green" onclick="pair()">Send pairing link</button>
    </div>
    <div class="log" id="pairLog"></div>
  </div>

  <div class="grid2">
    <div>
      <div class="card">
        <h2>2 · Controls</h2>
        <div class="btns">
          <button class="c-blue" onclick="cmd('STREAM_CAMERA')">📹 Start camera</button>
          <button class="c-slate" onclick="cmd('FLIP_CAMERA')">🔄 Flip camera</button>
          <button class="c-amber" onclick="cmd('TORCH_ON')">🔦 Torch on</button>
          <button class="c-slate" onclick="cmd('TORCH_OFF')">🔦 Torch off</button>
          <button class="c-amber" onclick="cmd('RING_ALARM')">🔔 Ring phone</button>
          <button class="c-blue" onclick="cmd('GET_GPS')">📍 Locate</button>
          <button class="c-red" onclick="cmd('LOCK_SCREEN')">🔒 Lock</button>
          <button class="c-red" onclick="wipe()">⚠️ Wipe</button>
        </div>
        <button class="c-slate full" style="margin-top:8px" onclick="stopAll()">⏹ Stop / reset</button>
        <div class="gps">
          <span id="gpsText">GPS: not requested</span>
          <a id="mapsLink" href="#" target="_blank" style="display:none">Open map ↗</a>
        </div>
      </div>

      <div class="card">
        <h2>3 · Send to phone</h2>
        <div class="row" style="margin-bottom:8px">
          <input id="speakInput" placeholder="Text for the phone to speak">
          <button class="c-blue" onclick="speak()">Speak</button>
        </div>
        <div class="row">
          <input id="noteInput" placeholder="Note to show on phone screen">
          <button class="c-blue" onclick="pushNote()">Send</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>4 · Live camera</h2>
      <div class="feed">
        <img id="liveImg" style="display:none">
        <div id="placeholder" class="placeholder">Pair a phone, then click Start camera</div>
      </div>
      <div class="row">
        <button class="c-blue full" onclick="saveScreenshot()">📸 Save screenshot</button>
        <button class="c-green full" onclick="shareWhatsApp()">📤 Alert on WhatsApp</button>
      </div>
    </div>
  </div>
</div>

<script>
  // --- Supabase project (REST API, no SDK needed) ---
  const SUPABASE_URL = 'https://uqzdaccxlhohtokmhuwt.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVxemRhY2N4bGhvaHRva21odXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU3MTQ2MzMsImV4cCI6MjExMTI5MDYzM30.H6jV2IyyEqzXPBXQdB_iVAbRO5kjdcBTC2ZR6wsLxsQ';

  const headers = {
    apikey: SUPABASE_KEY,
    Authorization: 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };

  let sessionId = null;
  let pollTimer = null;
  let stopped = false;

  function log(msg){ document.getElementById('pairLog').innerText = msg; }

  async function pair() {
    let phone = document.getElementById('phoneInput').value.trim().replace(/\D/g, '');
    if (!phone) return alert('Enter a phone number first.');
    if (phone.length === 10) phone = '91' + phone;

    sessionId = 'CS-' + Math.floor(100000 + Math.random() * 900000);
    document.getElementById('sessionBadge').innerText = 'Room ' + sessionId;

    const base = window.location.href.replace(/index\.html(\?.*)?$/, '').replace(/\/$/, '') + '/';
    const pairUrl = base + 'phone.html?session=' + sessionId;
    const msg = encodeURIComponent('CampusSync pairing link: ' + pairUrl);
    window.open('https://wa.me/' + phone + '?text=' + msg, '_blank');

    await fetch(SUPABASE_URL + '/rest/v1/device_sessions', {
      method: 'POST',
      headers,
      body: JSON.stringify({ session_id: sessionId, phone_number: phone })
    });

    log('Session created. Waiting for phone to connect…');
    clearInterval(pollTimer);
    pollTimer = setInterval(poll, 800);
  }

  async function patch(obj) {
    if (!sessionId) { alert('Pair a phone first.'); return; }
    await fetch(SUPABASE_URL + '/rest/v1/device_sessions?session_id=eq.' + sessionId, {
      method: 'PATCH',
      headers,
      body: JSON.stringify(obj)
    });
  }

  function cmd(c) { stopped = false; patch({ command: c }); }

  function speak() {
    const t = document.getElementById('speakInput').value.trim();
    if (t) patch({ clipboard_text: 'SPEAK::' + t, command: 'SPEAK_' + Date.now() });
  }

  function pushNote() {
    const t = document.getElementById('noteInput').value.trim();
    if (t) patch({ clipboard_text: 'NOTE::' + t, command: 'NOTE_' + Date.now() });
  }

  async function stopAll() {
    stopped = true;
    const img = document.getElementById('liveImg');
    img.style.display = 'none'; img.src = '';
    document.getElementById('placeholder').style.display = 'block';
    document.getElementById('placeholder').innerText = 'Stream stopped.';
    await patch({ command: 'IDLE', live_frame: null });
  }

  function wipe() {
    if (!sessionId) return alert('Pair a phone first.');
    if (prompt('Enter PIN to confirm wipe:') === '1234') cmd('WIPE_DATA');
    else alert('Incorrect PIN.');
  }

  function saveScreenshot() {
    const img = document.getElementById('liveImg');
    if (!img.src || img.style.display === 'none') return alert('No live feed to save.');
    const a = document.createElement('a');
    a.href = img.src; a.download = 'CampusSync_' + Date.now() + '.jpg'; a.click();
  }

  function shareWhatsApp() {
    let phone = document.getElementById('phoneInput').value.trim().replace(/\D/g, '');
    if (phone.length === 10) phone = '91' + phone;
    const text = encodeURIComponent('CampusSync alert: remote check completed from laptop.');
    window.open('https://wa.me/' + phone + '?text=' + text, '_blank');
  }

  async function poll() {
    const res = await fetch(SUPABASE_URL + '/rest/v1/device_sessions?session_id=eq.' + sessionId + '&select=*', { headers });
    const rows = await res.json();
    const data = rows[0];
    if (!data) return;

    log('Connected · last update ' + new Date().toLocaleTimeString());

    if (!stopped && data.live_frame) {
      const img = document.getElementById('liveImg');
      img.src = data.live_frame; img.style.display = 'block';
      document.getElementById('placeholder').style.display = 'none';
    }
    if (data.latitude && data.longitude) {
      document.getElementById('gpsText').innerText = 'GPS: ' + data.latitude + ', ' + data.longitude;
      const link = document.getElementById('mapsLink');
      link.href = 'https://www.google.com/maps?q=' + data.latitude + ',' + data.longitude;
      link.style.display = 'inline';
    }
  }
</script>
</body>
</html>
